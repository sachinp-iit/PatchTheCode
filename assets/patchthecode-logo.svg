<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PatchTheCode logo">
  <defs>
    <linearGradient id="ptc-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ptc-accent" x1="128" y1="160" x2="384" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#ptc-bg)"/>
  <rect x="96" y="120" width="320" height="272" rx="26" fill="#0b1220" stroke="#1e293b" stroke-width="6"/>
  <circle cx="140" cy="160" r="10" fill="#f87171"/>
  <circle cx="172" cy="160" r="10" fill="#fbbf24"/>
  <circle cx="204" cy="160" r="10" fill="#34d399"/>
  <rect x="96" y="184" width="320" height="4" fill="#1e293b"/>
  <text x="128" y="244" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="bold" fill="#34d399">$</text>
  <text x="158" y="244" font-family="Consolas, Menlo, monospace" font-size="30" fill="#e2e8f0">git apply fix.patch</text>
  <text x="128" y="308" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="bold" fill="#34d399">&#10003;</text>
  <text x="160" y="308" font-family="Consolas, Menlo, monospace" font-size="30" fill="#94a3b8">tests pass</text>
  <rect x="324" y="294" width="16" height="30" rx="4" fill="url(#ptc-accent)">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>